name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vet, test, doc count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      # Anti-zombie rule 6 in CLAUDE.md: 3 live docs under docs/, at most 1 plan.
      - name: Doc count
        run: |
          test "$(find docs -name '*.md' -not -path 'docs/agents/*' | wc -l)" -eq 3
          test "$(find .omc/plans -name '*.md' 2>/dev/null | wc -l)" -le 1
